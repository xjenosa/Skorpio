<style>

  .name { font-size: 14px; color: var(--fg-2); }
  .specimen { font-size: 38px; line-height: 1.05; letter-spacing: -0.02em; color: var(--fg-1); margin-top: auto; }
  .alpha { font-size: 12px; color: var(--fg-3); font-family: inherit; }
</style>
</head>
<body>
<div class="grid">
