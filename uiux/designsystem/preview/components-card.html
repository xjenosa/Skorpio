<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skorpio Â· Card</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-sans); padding: 24px; }
  .card { background: var(--bg-1); border: 1px solid var(--rule-2); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 12px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
  .title { font-size: 17px; font-weight: 500; }
  .body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule-1); border-radius: var(--radius-sm); background: var(--bg-0); }
  .stat .k { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
  .stat .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; color: var(--fg-1); }
  .stat .v .u { color: var(--fg-3); font-size: 12px; margin-left: 3px; }
  .foot { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; border-top: 1px dotted var(--rule-2); padding-top: 12px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--energy-clean); }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--energy-clean); animation: p 1.6s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
  .btn { font-family: var(--font-sans); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--rule-2); background: var(--bg-2); color: var(--fg-1); cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div>
      <div class="eyebrow">Site Â· PJM-WEST Â· ALPHA-04</div>
      <div class="title">Sterling, OH</div>
    </div>
    <span class="live">Live</span>
  </div>
  <div class="body">
    <div class="stat"><span class="k">Capacity</span><span class="v">38.4<span class="u">MW</span></span></div>
    <div class="stat"><span class="k">Carbon</span><span class="v">187<span class="u">gCOâ‚‚</span></span></div>
    <div class="stat"><span class="k">Spot</span><span class="v">$48.40</span></div>
  </div>
  <div class="foot">
    <span class="t-small" style="color: var(--fg-3);">Last update Â· 14:02:11 UTC</span>
    <button class="btn">Open report â†’</button>
  </div>
</div>
</body>
</html>
