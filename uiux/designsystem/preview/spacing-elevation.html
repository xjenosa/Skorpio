<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skorpio Â· Elevation</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-sans); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: var(--bg-1); border: 1px solid var(--rule-2); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
  .desc { font-size: 12px; color: var(--fg-2); }
</style>
</head>
<body>
<div class="grid">
  <div class="card" style="box-shadow: var(--shadow-1);"><span class="name">shadow-1</span><span class="desc">Default surface</span></div>
  <div class="card" style="box-shadow: var(--shadow-2);"><span class="name">shadow-2</span><span class="desc">Hover / popover</span></div>
  <div class="card" style="box-shadow: var(--shadow-3);"><span class="name">shadow-3</span><span class="desc">Modal</span></div>
  <div class="card" style="box-shadow: var(--glow-accent); border-color: var(--accent-line);"><span class="name" style="color: var(--accent);">glow-accent</span><span class="desc">Focused / active</span></div>
</div>
</body>
</html>
