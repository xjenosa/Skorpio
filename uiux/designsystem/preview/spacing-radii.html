<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skorpio Â· Radii</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-sans); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 100%; aspect-ratio: 1; background: var(--bg-2); border: 1px solid var(--rule-2); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
  .name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); }
</style>
</head>
<body>
<div class="grid">
  <div class="item"><div class="box" style="border-radius: var(--radius-xs);">6</div><div class="name">xs</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-sm);">10</div><div class="name">sm</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-md);">14</div><div class="name">md</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-lg);">20</div><div class="name">lg</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-xl);">28</div><div class="name">xl</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-pill);">âˆž</div><div class="name">pill</div></div>
</div>
</body>
</html>
