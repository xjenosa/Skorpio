<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skorpio Â· Spacing</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin:0; padding:0; background: var(--bg-0); color: var(--fg-1); font-family: var(--font-sans); padding: 24px; }
  .row { display: grid; grid-template-columns: 56px 1fr 60px; gap: 12px; align-items: center; padding: 6px 0; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--fg-3); }
  .bar { height: 18px; background: var(--accent); border-radius: 3px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); text-align: right; }
</style>
</head>
<body>
  <div class="row"><span class="name">sp-1</span><div class="bar" style="width: 4px;"></div><span class="px">4 px</span></div>
  <div class="row"><span class="name">sp-2</span><div class="bar" style="width: 8px;"></div><span class="px">8 px</span></div>
  <div class="row"><span class="name">sp-3</span><div class="bar" style="width: 12px;"></div><span class="px">12 px</span></div>
  <div class="row"><span class="name">sp-4</span><div class="bar" style="width: 16px;"></div><span class="px">16 px</span></div>
  <div class="row"><span class="name">sp-5</span><div class="bar" style="width: 20px;"></div><span class="px">20 px</span></div>
  <div class="row"><span class="name">sp-6</span><div class="bar" style="width: 24px;"></div><span class="px">24 px</span></div>
  <div class="row"><span class="name">sp-8</span><div class="bar" style="width: 32px;"></div><span class="px">32 px</span></div>
  <div class="row"><span class="name">sp-10</span><div class="bar" style="width: 40px;"></div><span class="px">40 px</span></div>
  <div class="row"><span class="name">sp-12</span><div class="bar" style="width: 48px;"></div><span class="px">48 px</span></div>
</body>
</html>
